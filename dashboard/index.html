<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TrustScan — Website Trust Analyzer</title>
  <link rel="icon" href="../assets/icons/icon128.png">
  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="../assets/icons/icon128.png" alt="">
        <div>
          <div class="brand-name">TrustScan</div>
          <div class="brand-sub">Website Trust &amp; Security Analyzer</div>
        </div>
      </div>
      <nav class="nav" aria-label="Main">
        <button class="nav-item" data-nav="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" data-nav="scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21"/></svg>
          <span>Scan Website</span>
        </button>
        <button class="nav-item" data-nav="linkcheck">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.6 1.6"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.6-1.6"/></svg>
          <span>Link Checker</span>
        </button>
        <button class="nav-item" data-nav="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span>Scan History</span>
        </button>
        <button class="nav-item" data-nav="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6M9 9h1.5"/></svg>
          <span>Reports</span>
        </button>
        <button class="nav-item" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
          <span>Settings</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="foot-version">TrustScan <span>v1.0.0</span></div>
        <div class="foot-disclaimer">An analysis tool, not a guarantee of website safety.</div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="topbar-title">Overview</h1>
          <span id="topbar-sub" class="topbar-sub"></span>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-new-scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New scan
        </button>
      </header>
      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="storage.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
